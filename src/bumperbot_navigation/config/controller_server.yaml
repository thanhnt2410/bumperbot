controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_treshold: 0.001
    mix_y_velocity_treshold: 0.5
    min_theta_velocity_treshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /bumperbot_controller/odom 
    controller_plugins: ["FollowPath", "MPC"]
    goal_checker_plugins: ["general_goal_checker"]
    progress_checker_plugins: "progress_checker"

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 15.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.3
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.8
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 1.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 1.0
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 10.0
      interpolate_curvature_after_goal: false
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0

    MPC:
      plugin: "bumperbot_motion::MPCController"
      prediction_horizon: 30
      time_step: 0.05
      reference_linear_velocity: 0.30
      goal_distance_tolerance: 0.25
      goal_yaw_tolerance: 0.25
      rotate_to_path_enter_angle: 0.785
      rotate_to_path_exit_angle: 0.35
      goal_angular_gain: 1.5
      goal_position_hysteresis: 0.05
      min_linear_velocity: 0.0
      max_linear_velocity: 0.30
      max_angular_velocity: 0.8
      max_linear_acceleration: 0.5
      max_angular_acceleration: 2.0
      q_x: 10.0
      q_y: 20.0
      q_yaw: 5.0
      r_v: 0.5
      r_omega: 0.2
      rd_v: 2.0
      rd_omega: 0.5
      obstacle_cost_weight: 2.0
      obstacle_slack_weight: 100.0
      obstacle_cost_limit: 0.5
      side_preference_cost: 0.2
      side_preference_activation_cost: 0.5
      side_preference_clear_cycles: 10
      collision_cost_threshold: 253
      consider_unknown_as_obstacle: true
      consider_outside_costmap_as_obstacle: true
      collision_failure_cycles: 10
      collision_failure_timeout: 1.0

    # PurePursuit:
    #   plugin: "bumperbot_motion::PurePursuit"
    #   look_ahead_distance: 0.5
    #   max_linear_velocity: 0.3
    #   max_angular_velocity: 1.0


local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: true
      robot_radius: 0.1
      resolution: 0.05
      always_send_full_costmap: true
      rolling_window: true
      width: 3
      height: 3

      plugins: ["obstacle_layer", "inflation_layer"]

      # static_layer:
      #   plugin: "nav2_costmap_2d::StaticLayer"
      #   map_topic: /map
      #   map_subscribe_transient_local: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35
        cost_scaling_factor: 3.0

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          marking: true
          clearing: true
          combination_method: 1
          raytrace_max_range: 3.0 
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      always_send_full_costmap: True
